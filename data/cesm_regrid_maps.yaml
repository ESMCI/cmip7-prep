# ESMF regrid weight files for CESM, keyed by resolution.
# See noresm_regrid_maps.yaml for the schema.

inputdata_dir: /glade/campaign/cesm/cesmdata/inputdata/

resolutions:
  ne30:
    conservative: cpl/gridmaps/ne30pg3/map_ne30pg3_to_1x1d_aave.nc
    bilinear: cpl/gridmaps/ne30pg3/map_ne30pg3_to_1x1d_bilin.nc
  tx2_3v2:
    conservative: cpl/gridmaps/tx2_3v2/map_t232_TO_1x1d_aave.251023.nc
    bilinear: cpl/gridmaps/tx2_3v2/map_t232_TO_1x1d_blin.251023.nc

  # 'custom' means the variable already carries lat/lon, so nothing is
  # regridded (see the resolution == "custom" branch in regrid.py) and no
  # weights are ever applied.  The entry exists only because _regrid_fx_once
  # builds a regridder before checking whether it needs one, so the file must
  # exist to be opened and discarded.  These are the maps the old implicit
  # fallback used; they are named here to keep that behaviour visible.
  custom:
    conservative: cpl/gridmaps/tx2_3v2/map_t232_TO_1x1d_aave.251023.nc
    bilinear: cpl/gridmaps/tx2_3v2/map_t232_TO_1x1d_blin.251023.nc


# Per-realm grids; see noresm_regrid_maps.yaml for the fields and a template.
#
# No ne16 entry: 'resolutions' above defines no ne16 weights for CESM, so an
# ne16 CESM run could never have regridded anything.
#
# The ocean, sea-ice and land-ice grid_labels are carried over unchanged and
# still say g106 (regular 1 x 1), which cannot be right for a tripolar or a
# projected grid.  They are left alone because this change is about where the
# input grid is stated, not about correcting CESM's labels.
grid_names_per_realm:
  ne30:
    atmos: {input_grid: ne30, grid_label: g106}
    aerosol: {input_grid: ne30, grid_label: g106}
    atmosChem: {input_grid: ne30, grid_label: g106}
    land: {input_grid: ne30, grid_label: g106}
    ocean: {input_grid: tx2_3v2, grid_label: g106}
    ocnBgchem: {input_grid: tx2_3v2, grid_label: g106}
    seaIce: {input_grid: tx2_3v2, grid_label: g106}
    landIce: {input_grid: custom, grid_label: g106}

# Static dataset (global attribute) metadata for the CMOR dataset JSON builder;
# see noresm_regrid_maps.yaml for the schema. CESM writes CESM3 at every
# resolution for now (placeholder).
dataset:
  base_source_id: CESM3
  source_type: AOGCM
  calendar: noleap
  source_ids: {}
  default_source_id: CESM3
  nominal_resolution: {}
  default_nominal_resolution: 100 km
