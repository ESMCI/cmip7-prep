# ESMF regrid weight files for CESM, keyed by resolution.
# See noresm_regrid_maps.yaml for the schema.

inputdata_dir: /glade/campaign/cesm/cesmdata/inputdata/

resolutions:
  ne30:
    conservative: cpl/gridmaps/ne30pg3/map_ne30pg3_to_1x1d_aave.nc
    bilinear: cpl/gridmaps/ne30pg3/map_ne30pg3_to_1x1d_bilin.nc
  tx2_3v2:
    conservative: cpl/gridmaps/tx2_3v2/map_t232_TO_1x1d_aave.251023.nc
    bilinear: cpl/gridmaps/tx2_3v2/map_t232_TO_1x1d_blin.251023.nc

  # 'regular' means the variable already carries lat/lon, so nothing is
  # regridded (see the resolution == "regular" branch in regrid.py) and no
  # weights are ever applied.  The entry exists only because _regrid_fx_once
  # builds a regridder before checking whether it needs one, so the file must
  # exist to be opened and discarded.  These are the maps the old implicit
  # fallback used; they are named here to keep that behaviour visible.
  regular:
    conservative: cpl/gridmaps/tx2_3v2/map_t232_TO_1x1d_aave.251023.nc
    bilinear: cpl/gridmaps/tx2_3v2/map_t232_TO_1x1d_blin.251023.nc


grid_names_per_realm:
  ne16:
    atmos: g123
    aerosol: g123
    atmosChem: g123
    land: g123
    seaIce: g202
    landIce: g194
  ne30:
    atmos: g106
    aerosol: g106
    atmosChem: g106
    land: g106
    seaIce: g106
    landIce: g106

# Static dataset (global attribute) metadata for the CMOR dataset JSON builder;
# see noresm_regrid_maps.yaml for the schema. CESM writes CESM3 at every
# resolution for now (placeholder).
dataset:
  base_source_id: CESM3
  source_type: AOGCM
  calendar: noleap
  source_ids: {}
  default_source_id: CESM3
  nominal_resolution: {}
  default_nominal_resolution: 100 km